<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <meta name="color-scheme" content="light" />
    <title>持续交付</title>
    <link rel="icon" type="image/svg+xml" href="assets/qwen-mark.svg" />
    <link rel="stylesheet" href="styles.css" />
    <script src="locales.js" defer></script>
    <script src="budget.generated.js"></script>
    <script src="app.js" defer></script>
  </head>
  <body>
    <svg class="symbols" aria-hidden="true">
      <defs>
        <symbol id="i-down" viewBox="0 0 24 24">
          <path d="M12 3v12m-5-5 5 5 5-5M4 16v4h16v-4" />
        </symbol>
        <symbol id="i-expand" viewBox="0 0 24 24">
          <path d="M9 4H4v5m11-5h5v5M4 15v5h5m11-5v5h-5" />
        </symbol>
        <symbol id="i-check" viewBox="0 0 24 24"><path d="m5 12 4 4L19 6" /></symbol>
        <symbol id="i-arrow" viewBox="0 0 24 24"><path d="M12 19V5m-6 6 6-6 6 6" /></symbol>
        <symbol id="i-clock" viewBox="0 0 24 24">
          <circle cx="12" cy="12" r="8" />
          <path d="M12 7v5l3 2" />
        </symbol>
        <symbol id="i-out" viewBox="0 0 24 24">
          <path d="M14 4h6v6m0-6L10 14M10 4H4v16h16v-6" />
        </symbol>
      </defs>
    </svg>

    <header class="topbar">
      <div class="brand"><img src="assets/qwen-mark.svg" alt="" /><span>持续交付</span></div>
      <div class="top-actions">
        <select id="run-select" aria-label="切换任务" hidden></select>
        <button id="new-task-button" class="quiet" hidden>＋ 新建任务</button>
        <button id="budget-button" class="quiet" disabled>
          <svg><use href="#i-clock" /></svg><span id="budget-label">总预算</span>
        </button>
        <button id="stop-button" class="stop" hidden>
          <span aria-hidden="true">■</span><span id="stop-label">停止任务</span>
        </button>
        <button id="show-guide" class="quiet" title="使用指引" aria-label="使用指引">
          使用指引
        </button>
        <div class="language-switch" role="group" aria-label="Language">
          <button data-lang="zh" lang="zh-CN">中文</button
          ><button data-lang="en" lang="en">English</button>
        </div>
      </div>
    </header>
    <main class="workspace">
      <aside class="conversation" aria-label="对话">
        <div class="conversation-heading">
          <h2>对话</h2>
          <span id="status-label" role="status">正在连接</span>
        </div>
        <div id="workspace-picker" hidden>
          <label>工作区<select id="task-workspace" aria-label="选择工作区"></select></label
          ><input
            id="workspace-name"
            aria-label="新工作区名称"
            placeholder="新工作区名称"
            maxlength="80"
          />
        </div>
        <div id="feed" class="feed" tabindex="0" aria-label="对话记录"></div>
        <div class="current-activity" id="current-activity" hidden>
          <span class="spinner" aria-hidden="true"></span><span id="activity-text"></span>
        </div>
        <details id="execution-details" class="execution-details" hidden>
          <summary>执行详情<span id="tool-count"></span></summary>
          <div id="execution-entries" tabindex="0"></div>
        </details>
        <form id="feedback-form" class="composer">
          <textarea
            id="feedback"
            rows="3"
            maxlength="30000"
            aria-label="任务需求或补充要求"
            placeholder="描述你想完成的成果…"
            required
          ></textarea>
          <div class="composer-footer">
            <span id="composer-hint">Enter 发送 · Shift+Enter 换行</span
            ><button id="send-button" class="primary" type="submit" disabled>
              <span id="send-label">发送</span><svg><use href="#i-arrow" /></svg>
            </button>
          </div>
        </form>
      </aside>
      <section class="delivery" aria-label="交付与预览">
        <div class="delivery-heading">
          <h1 id="task-title">开始一次持续交付</h1>
          <p id="delivery-summary">首版可用，逐版改进。</p>
        </div>
        <p id="state-notice" class="notice" role="status" hidden></p>
        <nav id="versions" class="versions" aria-label="交付版本"></nav>
        <section id="version-overview" class="version-overview" aria-label="本版改动" hidden>
          <h2>本版改动</h2>
          <p id="release-note"></p>
        </section>
        <section class="preview-panel" id="preview-panel" aria-label="版本预览">
          <div class="preview-toolbar">
            <h2 id="preview-title">成果预览</h2>
            <div class="preview-actions">
              <button id="preview-home" class="quiet" title="重新打开本版预览入口" disabled>
                预览首页
              </button>
              <a id="open-preview" class="quiet" target="_blank" rel="noopener noreferrer" hidden
                >独立打开<svg><use href="#i-out" /></svg
              ></a>
              <a id="download" class="quiet" download hidden
                >下载<svg><use href="#i-down" /></svg
              ></a>
              <button
                id="expand-preview"
                class="icon-button"
                aria-label="放大预览"
                title="放大预览"
                aria-expanded="false"
              >
                <svg><use href="#i-expand" /></svg>
              </button>
            </div>
          </div>
          <div class="preview-stage">
            <iframe
              id="artifact"
              title="交付成果预览"
              sandbox="allow-scripts allow-downloads"
              hidden
            ></iframe>
            <div id="preview-empty" class="preview-empty">
              <span id="preview-spinner" class="spinner" hidden></span>
              <h3 id="empty-title">让成果先到手，再不断完善。</h3>
              <p id="empty-copy">描述需求后开始。每次交付都可以预览、下载。</p>
            </div>
          </div>
        </section>
        <div id="release-info" class="release-info" hidden>
          <details id="release-details" class="release-details">
            <summary>交付详情</summary>
            <p id="release-time" class="muted"></p>
            <div id="check-list"></div>
          </details>
          <details id="release-files" class="release-details">
            <summary>文件</summary>
            <div class="file-search">
              <input
                id="file-filter"
                type="search"
                placeholder="按文件名搜索"
                aria-label="按文件名搜索"
              />
            </div>
            <div id="file-list"></div>
          </details>
        </div>
      </section>
    </main>
    <dialog id="budget-dialog">
      <form id="budget-form">
        <div class="dialog-heading">
          <h2 id="budget-title">总预算</h2>
          <button type="button" class="icon-button" id="close-budget" aria-label="关闭">×</button>
        </div>
        <div class="budget-input">
          <input
            id="task-budget"
            type="number"
            min="1"
            step="any"
            required
            aria-label="总预算数值"
          /><select id="task-budget-unit" aria-label="预算时间单位">
            <option value="60">分钟</option>
            <option value="3600">小时</option>
            <option value="86400">天</option>
          </select>
        </div>
        <p id="budget-help" class="muted"></p>
        <p id="budget-error" class="error" role="alert" hidden></p>
        <button id="save-budget" class="primary" type="submit">保存</button>
      </form>
    </dialog>
    <div id="guide-layer" popover="manual" hidden>
      <div id="guide-highlight"></div>
      <span id="guide-hand" aria-hidden="true">☝</span>
      <section id="quick-guide">
        <div class="dialog-heading">
          <strong id="guide-title"></strong
          ><button id="guide-skip" class="icon-button" aria-label="跳过指引">×</button>
        </div>
        <p id="guide-copy"></p>
        <div class="guide-footer">
          <label><input id="guide-never" type="checkbox" />不再提示</label
          ><button id="guide-next" class="primary">知道了</button>
        </div>
      </section>
    </div>
    <div id="toast" class="toast" role="status" hidden></div>
  </body>
</html>
